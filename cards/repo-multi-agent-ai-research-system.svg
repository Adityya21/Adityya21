<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="300" height="150" role="img"><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.fade{opacity:0;animation:fade .7s ease forwards}@keyframes fade{to{opacity:1}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}.grow{transform-box:fill-box;transform-origin:bottom;animation:grow .9s ease backwards}</style><rect x=".5" y=".5" width="299" height="149" rx="14" fill="#0b1220" stroke="#1e2a44"/><text x="24" y="36" font-size="14" fill="#e6edf7" font-weight="bold" text-anchor="start">Multi-Agent-AI-Research-System</text><text x="24" y="62" font-size="12" fill="#8fa3c2" font-weight="normal" text-anchor="start">ResearchMind is a quick‑and‑easy AI</text><text x="24" y="80" font-size="12" fill="#8fa3c2" font-weight="normal" text-anchor="start">research tool. You type a topic, and</text><text x="24" y="98" font-size="12" fill="#8fa3c2" font-weight="normal" text-anchor="start">four smart agents work together:</text><circle cx="30" cy="132" r="5" fill="#4da3ff"/><text x="42" y="136" font-size="11" fill="#e6edf7" font-weight="normal" text-anchor="start">Python</text><text x="276" y="136" font-size="11" fill="#8fa3c2" font-weight="normal" text-anchor="end">★ 0</text></svg>